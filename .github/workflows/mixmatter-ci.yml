name: Mixmatter Research CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "skills/mixmatter/**"
      - ".github/workflows/mixmatter-ci.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "skills/mixmatter/**"
      - ".github/workflows/mixmatter-ci.yml"

permissions:
  contents: read

jobs:
  validate-mcp-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Mixmatter package and research state
        shell: bash
        run: |
          python -m json.tool plugin.json >/dev/null
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          test -f skills/mixmatter/SKILL.md
          grep -q '^name: mixmatter          test -f docs/MIXMATTER_2_RUNTIME.md
          test -f docs/system/MIXMATTER_ART_DIRECTION_POLICY.md
          test -f docs/system/MIXMATTER_CORE_CONSTITUTION.md
          test -f docs/system/MIXMATTER_REGRESSION_BENCHMARK.md
          test -f docs/system/MIXMATTER_SYSTEM_SCHEMA.yaml
          test -f docs/system/MIXMATTER_TOOL_SPEC.md
          test -f docs/system/MIXMATTER_VISUAL_GRAMMAR.md
          test ! -d apps/mixmatter-chatgpt
          test ! -f docs/MIXMATTER_HOST_UI_V1.md
          test ! -f docs/MIXMATTER_HOST_UI_VISUAL_V1.md
 skills/mixmatter/SKILL.md
          test -f assets/mixmatter-icon-light.svg
          test -f assets/mixmatter-icon-dark.svg
          test ! -d skills/press-print
          test -f docs/MIXMATTER_2_RUNTIME.md
          test -f docs/system/MIXMATTER_ART_DIRECTION_POLICY.md
          test -f docs/system/MIXMATTER_CORE_CONSTITUTION.md
          test -f docs/system/MIXMATTER_REGRESSION_BENCHMARK.md
          test -f docs/system/MIXMATTER_SYSTEM_SCHEMA.yaml
          test -f docs/system/MIXMATTER_TOOL_SPEC.md
          test -f docs/system/MIXMATTER_VISUAL_GRAMMAR.md
          test ! -d apps/mixmatter-chatgpt
          test ! -f docs/MIXMATTER_HOST_UI_V1.md
          test ! -f docs/MIXMATTER_HOST_UI_VISUAL_V1.md
